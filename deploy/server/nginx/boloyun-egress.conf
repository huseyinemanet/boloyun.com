# Install as /etc/nginx/conf.d/boloyun-egress.conf (http context), before
# enabling the references in the site configuration. No User-Agent bypasses.
map $http_user_agent $boloyun_bulk_crawler {
    default 0;
    ~*(ClaudeBot|Bytespider|SemrushBot|AhrefsBot|MJ12bot|DotBot|SERankingBacklinksBot|serpstatbot|panscient\.com) 1;
}

# Only public catalogue documents and APIs consume these buckets. Static assets,
# auth and admin have their own existing application controls.
map $uri $boloyun_catalog_ip {
    default "";
    ~^/(oyun/|oyunlar|kategori/|etiket/|arama|sitemap) $binary_remote_addr;
}
map $uri $boloyun_api_ip {
    default "";
    ~^/api/(search|comments|game-state|continue-playing|public/) $binary_remote_addr;
}
limit_req_zone $boloyun_catalog_ip zone=boloyun_catalog:10m rate=30r/m;
limit_req_zone $boloyun_api_ip zone=boloyun_api:10m rate=90r/m;

# Dedicated vhost log; no cookies, authorization, referrer or search values.
# Raw IPs remain solely in the server log (restrict access/rotate as for Nginx).
log_format boloyun_egress escape=json
    '{"time":"$time_iso8601","host":"$host","ip":"$remote_addr",'
    '"method":"$request_method","route":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"seconds":$request_time,'
    '"upstream_seconds":"$upstream_response_time",'
    '"route_cache":"$upstream_http_x_nextjs_cache","ua":"$http_user_agent"}';
