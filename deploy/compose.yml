name: boloyun

services:
  app:
    image: boloyun:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: boloyun-app
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - /opt/boloyun/cache:/app/.next/cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1400m
    mem_reservation: 512m
    cpus: 1.25
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
