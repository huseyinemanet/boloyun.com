name: Quality and production deploy

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  verify-production-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          tags: boloyun:${{ github.sha }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            SITE_URL=https://boloyun.com
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,mode=max,scope=production-image

  build-production-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: boloyun:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            SITE_URL=https://boloyun.com
          cache-from: type=gha,scope=production-image
      - name: Package production image
        env:
          DEPLOY_SIGNING_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SIGNING_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          key_file="${RUNNER_TEMP}/boloyun-deploy-signing-private.pem"
          trap 'rm -f "$key_file"' EXIT
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$DEPLOY_SIGNING_PRIVATE_KEY" > "$key_file"
          archive="boloyun-${GITHUB_SHA}.tar.gz"
          manifest="boloyun-${GITHUB_SHA}.manifest"
          signature="boloyun-${GITHUB_SHA}.sig"
          docker save "${IMAGE_NAME}" | gzip -1 > "$archive"
          archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          image_id="$(docker image inspect --format '{{.Id}}' "${IMAGE_NAME}")"
          printf 'schema_version=1\nrevision=%s\nimage_tag=%s\nimage_id=%s\narchive_name=%s\narchive_sha256=%s\n' \
            "$GITHUB_SHA" "$IMAGE_NAME" "$image_id" "$archive" "$archive_sha256" > "$manifest"
          openssl pkeyutl -sign -rawin -inkey "$key_file" -in "$manifest" -out "$signature"
      - name: Store production image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-image-${{ github.sha }}
          path: |
            boloyun-${{ github.sha }}.tar.gz
            boloyun-${{ github.sha }}.manifest
            boloyun-${{ github.sha }}.sig
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, build-production-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: boloyun-production
      cancel-in-progress: false
    env:
      IMAGE_NAME: boloyun:${{ github.sha }}
    steps:
      - name: Download production image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: production-image-${{ github.sha }}
          path: /tmp/boloyun-release-artifact
      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Upload production image
        run: |
          scp -o BatchMode=yes \
            "/tmp/boloyun-release-artifact/boloyun-${GITHUB_SHA}.tar.gz" \
            "/tmp/boloyun-release-artifact/boloyun-${GITHUB_SHA}.manifest" \
            "/tmp/boloyun-release-artifact/boloyun-${GITHUB_SHA}.sig" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/"
      - name: Deploy and verify production
        run: ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "sudo -n /usr/local/sbin/boloyun-deploy '${GITHUB_SHA}'"
