name: Quality and production deploy

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  verify-production-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: boloyun:${{ github.sha }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            SITE_URL=https://boloyun.com
          secrets: |
            supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,mode=max,scope=production-image

  build-production-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: boloyun:${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            SITE_URL=https://boloyun.com
          secrets: |
            supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          cache-from: type=gha,scope=production-image
      - name: Package production image
        run: |
          docker save "${IMAGE_NAME}" | gzip -1 > "boloyun-${GITHUB_SHA}.tar.gz"
          cp deploy/compose.yml "boloyun-compose-${GITHUB_SHA}.yml"
          cp deploy/server/boloyun-deploy "boloyun-deploy-${GITHUB_SHA}"
      - name: Store production image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: production-image-${{ github.sha }}
          path: |
            boloyun-${{ github.sha }}.tar.gz
            boloyun-compose-${{ github.sha }}.yml
            boloyun-deploy-${{ github.sha }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, build-production-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: boloyun-production
      cancel-in-progress: false
    env:
      IMAGE_NAME: boloyun:${{ github.sha }}
    steps:
      - name: Download production image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: production-image-${{ github.sha }}
          path: /tmp/boloyun-deploy-artifact
      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Upload production image
        run: |
          scp -o BatchMode=yes \
            "/tmp/boloyun-deploy-artifact/boloyun-${GITHUB_SHA}.tar.gz" \
            "/tmp/boloyun-deploy-artifact/boloyun-compose-${GITHUB_SHA}.yml" \
            "/tmp/boloyun-deploy-artifact/boloyun-deploy-${GITHUB_SHA}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/"
      - name: Deploy and verify production
        run: ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "sudo -n /usr/local/sbin/boloyun-deploy '${GITHUB_SHA}'"
